<?xml version="1.0" encoding="UTF-8"?>
<!--
  Steam-Deck Front-View für den Controller-Tab im Launcher.
  Anordnung anatomisch korrekt zum echten Deck (Bild 74):
    LINKE SEITE  (top → bottom): L-Stick   → D-Pad → L-Trackpad
    RECHTE SEITE (top → bottom): R-Stick   → ABXY  → R-Trackpad
    ZENTRUM: Display + View/Menu/Steam/Quick-Access
    OBERE KANTE: L1/L2 + R1/R2 (Schultern hinten, oben drauf gerendert)

  Alle interaktiven Buttons tragen ein data-button-Attribut für die
  Event-Verkabelung im Renderer (siehe wireSvgListeners in config-modal.ts).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 429" role="img" aria-label="Steam Deck (Vorderseite)" class="ctrlSvg ctrlSvgStyleSteamdeck">
  <defs>
    <radialGradient id="deckScreenGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#1a3550" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- ═══ Body-Silhouette (aus steamdeckFront.svg path #3 übernommen) ═══ -->
  <path class="ctrlSvgBody" d="M 24.687 158.986 C 24.078 104.857 23.773 77.792 37.395 58.774 C 41.792 52.634 47.135 47.231 53.224 42.765 C 72.087 28.930 99.154 28.930 153.288 28.930 H 911.302 C 965.435 28.930 992.502 28.930 1011.365 42.765 C 1017.454 47.231 1022.797 52.634 1027.195 58.774 C 1040.817 77.792 1040.512 104.857 1039.903 158.986 L 1038.873 250.404 C 1038.054 323.325 1037.644 359.786 1018.852 385.286 C 1012.781 393.525 1005.459 400.765 997.151 406.744 C 971.441 425.247 934.978 425.247 862.052 425.247 H 202.547 C 129.621 425.247 93.158 425.247 67.448 406.744 C 59.141 400.765 51.819 393.525 45.747 385.286 C 26.955 359.786 26.544 323.325 25.723 250.404 Z"/>

  <!-- Top-Innen-Schatten (aus steamdeckFront.svg path #4, opacity 0.3) -->
  <path opacity="0.30" stroke="rgba(255,255,255,0.10)" stroke-width="1" fill="none" d="M 1040.376 119.357 L 1036.929 100.505 C 1030.521 65.512 1000.025 40.094 964.450 40.094 H 99.278 C 63.703 40.094 33.209 65.512 26.801 100.505 L 23.350 119.357"/>

  <!-- ═══ TRIGGER + BUMPER (oben hinter dem Body) ═══ -->
  <rect data-button="l2" class="ctrlSvgBtn ctrlSvgTrigger" x="85"  y="2"  width="155" height="22" rx="9"/>
  <text class="ctrlSvgLbl ctrlSvgLblTrigger" x="162" y="17" style="font-size:13px;">L2</text>
  <rect data-button="r2" class="ctrlSvgBtn ctrlSvgTrigger" x="820" y="2"  width="155" height="22" rx="9"/>
  <text class="ctrlSvgLbl ctrlSvgLblTrigger" x="897" y="17" style="font-size:13px;">R2</text>
  <rect data-button="l1" class="ctrlSvgBtn ctrlSvgShoulder" x="85"  y="26" width="155" height="14" rx="7"/>
  <text class="ctrlSvgLbl ctrlSvgLblShoulder" x="162" y="36" style="font-size:10px;">L1</text>
  <rect data-button="r1" class="ctrlSvgBtn ctrlSvgShoulder" x="820" y="26" width="155" height="14" rx="7"/>
  <text class="ctrlSvgLbl ctrlSvgLblShoulder" x="897" y="36" style="font-size:10px;">R1</text>

  <!-- ═══ LINKE SEITE — vertikale Stapelung: Stick → D-Pad → Trackpad ═══ -->

  <!-- L-Stick: TOP-LEFT (Position vom Front-SVG übernommen, leicht nach oben) -->
  <circle class="ctrlSvgStickWell"      cx="155" cy="100" r="48"/>
  <circle class="ctrlSvgStickWellInner" cx="155" cy="100" r="41"/>
  <circle data-button="l3" class="ctrlSvgBtn ctrlSvgStick" cx="155" cy="100" r="34"/>
  <circle class="ctrlSvgStickRim"       cx="155" cy="100" r="30"/>
  <circle data-stick="l"  class="ctrlSvgStickDot" cx="155" cy="100" r="14"/>

  <!-- D-Pad: MITTE-LEFT, direkt unter L-Stick -->
  <rect class="ctrlSvgDpadCenter" x="142" y="187" width="26" height="26"/>
  <rect data-button="dpadUp"    class="ctrlSvgBtn ctrlSvgDpad" x="142" y="154" width="26" height="33" rx="4"/>
  <path class="ctrlSvgDpadArrow" d="M 148 176 L 155 166 L 162 176 Z"/>
  <rect data-button="dpadDown"  class="ctrlSvgBtn ctrlSvgDpad" x="142" y="213" width="26" height="33" rx="4"/>
  <path class="ctrlSvgDpadArrow" d="M 148 224 L 155 234 L 162 224 Z"/>
  <rect data-button="dpadLeft"  class="ctrlSvgBtn ctrlSvgDpad" x="109" y="187" width="33" height="26" rx="4"/>
  <path class="ctrlSvgDpadArrow" d="M 131 193 L 119 200 L 131 207 Z"/>
  <rect data-button="dpadRight" class="ctrlSvgBtn ctrlSvgDpad" x="168" y="187" width="33" height="26" rx="4"/>
  <path class="ctrlSvgDpadArrow" d="M 179 193 L 191 200 L 179 207 Z"/>

  <!-- L-Trackpad: BOTTOM-LEFT (gross, dominant) -->
  <circle class="ctrlSvgTrackpad"      cx="155" cy="325" r="60"/>
  <circle class="ctrlSvgTrackpadInner" cx="155" cy="325" r="52"/>
  <line class="ctrlSvgTrackpadCross" x1="100" y1="325" x2="210" y2="325"/>
  <line class="ctrlSvgTrackpadCross" x1="155" y1="270" x2="155" y2="380"/>

  <!-- ═══ RECHTE SEITE — vertikale Stapelung: Stick → ABXY → Trackpad (symmetrisch) ═══ -->

  <!-- R-Stick: TOP-RIGHT (Position vom Front-SVG übernommen) -->
  <circle class="ctrlSvgStickWell"      cx="905" cy="100" r="48"/>
  <circle class="ctrlSvgStickWellInner" cx="905" cy="100" r="41"/>
  <circle data-button="r3" class="ctrlSvgBtn ctrlSvgStick" cx="905" cy="100" r="34"/>
  <circle class="ctrlSvgStickRim"       cx="905" cy="100" r="30"/>
  <circle data-stick="r"  class="ctrlSvgStickDot" cx="905" cy="100" r="14"/>

  <!-- ABXY-Cluster: MITTE-RIGHT, direkt unter R-Stick (Y top — A bottom — X left — B right) -->
  <circle data-button="y" class="ctrlSvgBtn ctrlSvgFace ctrlSvgXboxY" cx="905" cy="170" r="18"/>
  <text class="ctrlSvgLbl ctrlSvgLblFace" x="905" y="176" style="font-size:16px;">Y</text>
  <circle data-button="b" class="ctrlSvgBtn ctrlSvgFace ctrlSvgXboxB" cx="940" cy="205" r="18"/>
  <text class="ctrlSvgLbl ctrlSvgLblFace" x="940" y="211" style="font-size:16px;">B</text>
  <circle data-button="a" class="ctrlSvgBtn ctrlSvgFace ctrlSvgXboxA" cx="905" cy="240" r="18"/>
  <text class="ctrlSvgLbl ctrlSvgLblFace" x="905" y="246" style="font-size:16px;">A</text>
  <circle data-button="x" class="ctrlSvgBtn ctrlSvgFace ctrlSvgXboxX" cx="870" cy="205" r="18"/>
  <text class="ctrlSvgLbl ctrlSvgLblFace" x="870" y="211" style="font-size:16px;">X</text>

  <!-- R-Trackpad: BOTTOM-RIGHT (gross, dominant) -->
  <circle class="ctrlSvgTrackpad"      cx="905" cy="325" r="60"/>
  <circle class="ctrlSvgTrackpadInner" cx="905" cy="325" r="52"/>
  <line class="ctrlSvgTrackpadCross" x1="850" y1="325" x2="960" y2="325"/>
  <line class="ctrlSvgTrackpadCross" x1="905" y1="270" x2="905" y2="380"/>

  <!-- ═══ ZENTRUM: Display ═══ -->
  <rect class="ctrlSvgScreen" x="245" y="55" width="570" height="290" rx="10"/>
  <rect class="ctrlSvgScreenGlow" x="253" y="63" width="554" height="274" rx="8" fill="url(#deckScreenGrad)"/>
  <text class="ctrlSvgSteamWord" x="530" y="205" style="font-size:18px; letter-spacing:0.42em;">STEAM DECK</text>

  <!-- View / Menu (Select / Start) — am unteren Display-Rand -->
  <rect data-button="select" class="ctrlSvgBtn ctrlSvgSysButton" x="265" y="352" width="40" height="16" rx="3"/>
  <rect class="ctrlSvgSysIcon" x="272" y="358" width="26" height="2"/>
  <rect class="ctrlSvgSysIcon" x="272" y="363" width="26" height="2"/>
  <rect data-button="start" class="ctrlSvgBtn ctrlSvgSysButton" x="755" y="352" width="40" height="16" rx="3"/>
  <rect class="ctrlSvgSysIcon" x="764" y="357" width="22" height="1.8"/>
  <rect class="ctrlSvgSysIcon" x="764" y="361" width="15" height="1.8"/>
  <rect class="ctrlSvgSysIcon" x="764" y="365" width="18" height="1.8"/>

  <!-- Steam-Button (links unter Screen) -->
  <circle class="ctrlSvgSteamButton" cx="360" cy="377" r="14"/>
  <path class="ctrlSvgSteamLogo" d="M 353 372 a 7 7 0 1 0 14 0 a 7 7 0 1 0 -14 0 M 361 369 L 367 364"/>

  <!-- Quick-Access (3-dot) — rechts unter Screen -->
  <circle class="ctrlSvgQuickAccess" cx="700" cy="377" r="14"/>
  <circle class="ctrlSvgQuickAccessDot" cx="693" cy="377" r="2"/>
  <circle class="ctrlSvgQuickAccessDot" cx="700" cy="377" r="2"/>
  <circle class="ctrlSvgQuickAccessDot" cx="707" cy="377" r="2"/>

</svg>
