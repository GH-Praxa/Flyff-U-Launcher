<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="ui_sidepanel.css">
</head>
<body>
  <div id="app">

    <header class="panel-header">
      <div class="title">
        <span class="dot"></span>
        <span>Kill Timer</span>
      </div>
      <label class="checkbox">
        <input id="enabledToggle" type="checkbox" checked />
        <span>Enable</span>
      </label>
    </header>

    <div class="settings-card">
      <div class="section-label">Overlay Position</div>
      <div class="sliders">
        <label class="pos slider">
          <span>X (%)</span>
          <button type="button" class="step-btn" data-target="overlayPosX" data-dir="-1">-</button>
          <input id="overlayPosX" type="range" min="0" max="100" step="1" value="50" />
          <button type="button" class="step-btn" data-target="overlayPosX" data-dir="1">+</button>
          <span id="overlayPosXVal" class="value">50</span>
        </label>
        <label class="pos slider">
          <span>Y (%)</span>
          <button type="button" class="step-btn" data-target="overlayPosY" data-dir="-1">-</button>
          <input id="overlayPosY" type="range" min="0" max="100" step="1" value="5" />
          <button type="button" class="step-btn" data-target="overlayPosY" data-dir="1">+</button>
          <span id="overlayPosYVal" class="value">5</span>
        </label>
      </div>
    </div>

    <div class="settings-card">
      <div class="section-label">Alert Threshold</div>
      <label class="pos slider">
        <span id="thresholdLabel">Alert HP% &le;</span>
        <button type="button" class="step-btn" data-target="thresholdSlider" data-dir="-1">-</button>
        <input id="thresholdSlider" type="range" min="5" max="50" step="5" value="20" />
        <button type="button" class="step-btn" data-target="thresholdSlider" data-dir="1">+</button>
        <span id="thresholdVal" class="value threshold-val">20%</span>
      </label>
      <div class="hint-text" id="thresholdHint">Widget flashes red when enemy HP reaches this level.</div>
    </div>

    <div class="reset-section">
      <button id="resetBtn" class="ghost">Reset Timer</button>
      <div class="hint-text" id="timerHint">Timer starts on first HP loss. Resets automatically on target change.</div>
    </div>

  </div>
  <script src="ui_sidepanel.js"></script>
</body>
</html>
